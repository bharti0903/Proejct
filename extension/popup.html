<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Today Usage</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Inter, Arial, sans-serif;
      width: 370px;
      margin: 0;
      padding: 16px;
      background: #020617;
      color: #e2e8f0;
    }

    .card {
      position: relative;
      background: linear-gradient(135deg, rgba(15,23,42,0.96), rgba(30,41,59,0.92));
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.35);
      backdrop-filter: blur(14px);
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      top: -20px;
      left: -20px;
      width: 120px;
      height: 120px;
      border-radius: 999px;
      background: rgba(59,130,246,0.08);
      filter: blur(20px);
      pointer-events: none;
    }

    .title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 12px;
      color: #fff;
      position: relative;
      z-index: 1;
    }

    .label {
      font-size: 12px;
      color: #94a3b8;
    }

    .value {
      font-size: 24px;
      font-weight: 800;
      margin-top: 4px;
      color: #fff;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      position: relative;
      z-index: 1;
    }

    .status {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .focus-active {
      background: rgba(34,197,94,0.16);
      color: #86efac;
      border-color: rgba(34,197,94,0.2);
    }

    .focus-inactive {
      background: rgba(239,68,68,0.16);
      color: #fca5a5;
      border-color: rgba(239,68,68,0.2);
    }

    .small {
      font-size: 13px;
      color: #cbd5e1;
      margin-top: 8px;
      position: relative;
      z-index: 1;
    }

    .error {
      color: #fca5a5;
      font-size: 13px;
      margin-top: 10px;
      line-height: 1.5;
    }

    .refresh-btn {
      width: 100%;
      border: none;
      background: linear-gradient(90deg, #06b6d4, #4f46e5);
      color: white;
      padding: 12px 14px;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 800;
      font-size: 14px;
      box-shadow: 0 10px 25px rgba(79,70,229,0.28);
    }

    .refresh-btn:hover {
      opacity: 0.95;
    }

    .notification-card {
      position: relative;
      border-radius: 22px;
      padding: 16px;
      margin-bottom: 14px;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 18px 40px rgba(0,0,0,0.35);
      backdrop-filter: blur(16px);
      background: linear-gradient(135deg, rgba(15,23,42,0.96), rgba(30,41,59,0.92));
      overflow: hidden;
    }

    .notification-card.hidden {
      display: none;
    }

    .notification-card.warning {
      border-color: rgba(251,191,36,0.24);
    }

    .notification-card.danger {
      border-color: rgba(248,113,113,0.24);
    }

    .notification-card.info {
      border-color: rgba(96,165,250,0.24);
    }

    .notification-glow {
      position: absolute;
      top: -20px;
      left: -20px;
      width: 130px;
      height: 130px;
      border-radius: 999px;
      filter: blur(22px);
      pointer-events: none;
    }

    .notification-card.warning .notification-glow {
      background: rgba(245,158,11,0.16);
    }

    .notification-card.danger .notification-glow {
      background: rgba(239,68,68,0.16);
    }

    .notification-card.info .notification-glow {
      background: rgba(59,130,246,0.16);
    }

    .notification-top {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .notification-badge {
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: rgba(255,255,255,0.08);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .notification-title {
      position: relative;
      z-index: 1;
      font-size: 18px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 6px;
    }

    .notification-message {
      position: relative;
      z-index: 1;
      font-size: 14px;
      line-height: 1.6;
      color: #cbd5e1;
    }

    .notification-close {
      width: 34px;
      height: 34px;
      border: none;
      border-radius: 12px;
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      line-height: 1;
    }

    .notification-close:hover {
      background: rgba(255,255,255,0.14);
    }
  </style>
</head>
<body>
  <div id="liveAlertCard" class="notification-card hidden">
    <div class="notification-glow"></div>
    <div class="notification-top">
      <span id="liveAlertBadge" class="notification-badge">Info</span>
      <button id="liveAlertClose" class="notification-close" aria-label="Close notification">⌃</button>
    </div>
    <div id="liveAlertTitle" class="notification-title">Notification</div>
    <div id="liveAlertMessage" class="notification-message">Alert text</div>
  </div>

  <div class="card">
    <div class="title">Today’s Usage</div>
    <div class="row">
      <div>
        <div class="label">Total Time</div>
        <div id="todayTotal" class="value">--</div>
      </div>
      <div>
        <div class="label">Sessions</div>
        <div id="sessionCount" class="value">--</div>
      </div>
    </div>
    <div class="small">Top Category: <strong id="topCategory">--</strong></div>
    <div class="small">Usage Status: <strong id="usageStatus">--</strong></div>
  </div>

  <div class="card">
    <div class="title">Focus Mode</div>
    <div id="focusStatus" class="status focus-inactive">Inactive</div>
    <div class="small">Remaining: <strong id="focusRemaining">--</strong></div>
    <div class="small">Blocked Sites: <strong id="blockedCount">0</strong></div>
  </div>

  <button id="refreshBtn" class="refresh-btn" type="button">Refresh</button>
  <div id="errorMsg" class="error"></div>

  <script src="popup.js"></script>
</body>
</html>
